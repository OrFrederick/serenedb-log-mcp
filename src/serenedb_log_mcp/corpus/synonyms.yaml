fabric: [torus, tree, link]
cable: [wire, link, linkcard]
connection: [socket, link, severed, reset, closed, communication]
disconnected: [severed, closed, reset]
lost: [severed, closed, reset, timeout]
communication: [socket, link, connection, message]

# Storage
storage: [lustre, nfs, mount, disk]
filesystem: [lustre, nfs, mount, disk]
disk: [mount, lustre, nfs, file]
