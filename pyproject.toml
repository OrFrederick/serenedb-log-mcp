[project]
name = "serenedb-log-mcp"
version = "0.1.0"
description = "MCP server for Role-specific log search and aggregation over SereneDB"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
serenedb-log-mcp = "serenedb_log_mcp.cli:main"

[dependency-groups]
dev = [
    "anyio>=4.9",
    # jsonschema: the contract tests validate a tool result against the schema the server
    # publishes, independently of the pydantic model it was built from.
    "jsonschema>=4.23",
    "mypy>=1.15",
    "pytest>=8.3",
    # pyyaml: the eval question set (eval/questions.yaml, T17).
    "pyyaml>=6.0",
    "ruff>=0.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "scripts", "bench", "eval", "tests"]
# overnight/ is the unattended-run harness, not part of the product.
extend-exclude = ["overnight"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "scripts", "bench", "eval"]
mypy_path = ["src", "eval"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "bench", "eval", "tests/support", "tests/golden"]
# The db and corpus markers are defined in tests/conftest.py.
# importlib mode lets two test files share a name in different directories.
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "-p", "pytester"]
