rules_bgl:
  fp_register_dump: Floating Point|exception summary|round (nearest|toward)|^(plus|minus) |quiet |fraction |enable .*exceptions|invalid operation|underflow exception|divide-by-zero exception|inexact exception|^reserved\.|^invalid
    \(|non-IEEE
  filesystem: mount|Lustre|NFS|chdir
  power_thermal: '[Pp]ower|[Tt]emperature [Oo]ver|temperature sensor|PGOOD'
  network_torus_tree_link: torus|tree|Torus|[Ll]ink[Cc]ard|link card|MidplaneSwitch|socket|ethernet|CioStream|[Cc]able|wire|Ido packet|no ethernet
  l3_edram: L3|EDRAM|in directory|scratchpad|retagging|start (initialization|flushing|prefetching)|speculative|cache directory|write buffer|hidden refreshes|write lines|DDR we are caching|DDR UE|parity
    error in (bank|read queue)|interrupt threshold\.|EDRAM pages|outstanding prefetches|prefetch depth for core
  ddr_memory: \bddr\b|\bDDR\b|CE sym|memory manager|memory and bus|command manager|state machine\.|regctl|capture valid|^symbol\.|^mask\.|^miscompare|^address parity|^correctable error\.|qw trapped|chip
    select|correctable ddr|rror threshold
  cache_tlb_parity: cache.*parity|parity error|i-cache|d-cache|DCACHE|plb error|tlb error|TLB|L2 (DCU|dcache)
  cpu_exception: program interrupt|alignment exceptions|illegal|privileged|trap instr|operation\.\.\.|byte ordering|auxiliary|data store interrupt|store operation|data storage interrupt|exception syndrome|i-fetch|^program$
  cpu_register_dump: register|[Rr]egisters|machine state|wait state|interrupt enable|problem state|instr\. enabled|floating pt ex mode|debug |address space|store gathering|apu instruction|trace broadcast|guaranteed|force
    load|icache prefetch|lr:|msr=|dbcr0|^iar |instruction address|summary\.\.\.|interrupt \(unit|DCR read timeout|PLB write|suppressing further|total interrupts
  kernel_crash: 'panic|kernel terminated|rts internal|^machine check interrupt|Microloader|shutdown complete|rts: bad message|Target='
  control_daemons_ciodb: ciodb|idoproxy
  app_job_ciod: ciod|program image|job |core\.|core files
  hw_service_discovery: ServiceAction|PrepareForService|NodeCard|Node card|node card|VPD|ecid|assembly|IDO|ido chip|Ido chip|SerialNumber|service card
  control_daemons: started|restarted|exited|SystemController|Controlling|background command|BGLMaster|idoproxy|mmcs|ciodb|DeclareService|subnets
