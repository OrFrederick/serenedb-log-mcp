# Labelled query set for issue #7 (template retrieval).
# Unit: Loghub-2.0 templates (BGL 320, OpenStack 48), ids as in *_templates.csv.
# Judged by OrFrederick's Claude from the template text alone (component/level shown only as a tie-breaker).
#
# Relevance rule (apply this to audit):
#   A template is relevant if a Log Entry matching it is DIRECT evidence of the phenomenon the
#   question asks about (an Engineer would want to see and count it). Generic register/dump
#   continuation lines (e.g. BGL "general purpose registers:", "msr=... dear=...") are NOT relevant
#   even when they follow a relevant line, because their text alone does not show the phenomenon.
#   Startup/heartbeat lines are relevant only when the question asks about that activity.
# kind:
#   keyword    = the question uses the vocabulary of the templates.
#   paraphrase = the question is phrased the way a human would ask, with little or no shared vocabulary.
#   (the script also computes measured lexical overlap per query; reported separately)
# no_relevant: true = no template in the Dataset is relevant (e.g. "disk full"); excluded from averages,
#               used to show what each method returns when the honest answer is "nothing".

bgl:
