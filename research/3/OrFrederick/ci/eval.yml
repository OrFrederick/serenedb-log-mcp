# DRAFT for .github/workflows/eval.yml (issue #3). Not active: lives under research/.
name: eval
on:
  pull_request:
    paths: ["src/**", "harness/**", "tests/**"]
  workflow_dispatch:
    inputs:
      k: {default: "3"}
      model: {default: "claude-sonnet-5-5"}
jobs:
  contract:            # every PR, no model, no secret: graders + MCP contract + golden SQL
    runs-on: ubuntu-latest
    services:
      serenedb:
        image: serenedb/serenedb:26.09.1.3      # pin; same tag as local dev
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["7890:7890"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4                  # raw corpus is ~770 MB; download once
        with: {path: data/raw, key: corpus-zenodo-8196385-v1}
      - run: uv sync --frozen
      - run: uv run python scripts/load.py      # the organisers' loader (skip if cache hit + already loaded)
      - run: uv run pytest -q                   # unit tests for graders + golden-SQL tests
      - run: npx -y @modelcontextprotocol/inspector@2.11.0 --cli uv run serenedb-log-mcp --method tools/list > tools.json
      - run: uv run python harness/check_tool_descriptions.py tools.json   # purpose/inputs/outputs present, limits stated
  agent-eval:          # manual or nightly: live Claude, k trials, costs money
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      serenedb: {image: "serenedb/serenedb:26.09.1.3", env: {POSTGRES_PASSWORD: postgres}, ports: ["7890:7890"]}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # enables --bare (no user CLAUDE.md/hooks/plugins)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with: {path: data/raw, key: corpus-zenodo-8196385-v1}
      - run: uv sync --frozen && uv run python scripts/load.py
      - run: npm i -g @anthropic-ai/claude-code
      - run: uv run python harness/run_eval.py --k ${{ inputs.k }} --model ${{ inputs.model }} --out results.jsonl
      - run: uv run python harness/run_eval.py --report results.jsonl --k ${{ inputs.k }} >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with: {name: eval-results, path: results.jsonl}
