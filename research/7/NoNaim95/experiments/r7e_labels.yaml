# Hand-labelled query set for issue #7 (retrieval over Loghub-2.0 templates).
# Labeller: experimenter Claude (r7e). The same agent wrote queries, labels AND the synonym
# dictionary -> labelling bias is real; see `bias:` notes and findings.md.
# type: kw     = shares content words with the relevant templates (after stemming)
#       para   = paraphrase, (nearly) no content-word overlap with the relevant templates
#       mixed  = some overlap, but the key concept is paraphrased
# relevant: Loghub-2.0 EventIds judged relevant by reading every template of the Dataset
# (dumped in r7e_templates.json). Relevance = "an Engineer asking this would want to see Log Entries
# of this template". Register-dump continuation lines (e.g. "tlb error.......<*>") are judged
# relevant only when their text itself names the asked-about concept.
bias:
  - Labeller saw all templates before writing queries, so queries tend to target concepts present in the data.
  - Paraphrase queries were written deliberately to avoid template words; real Engineers would mix both.
  - The synonym dictionary (method b) was written by the same agent after reading the templates -> it is an optimistic upper bound for hand-written synonyms.
  - Large relevant sets (e.g. memory, network) cap standard recall@10; we also report capped recall = hits/min(k,|rel|).
