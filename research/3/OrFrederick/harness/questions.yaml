# Draft eval question set for issue #3. Golden values were measured on 2026-10-16 against the
# dev-loader tables (bgl 4,747,963 rows; openstack 207,820 rows). Re-measure after the official
# loader lands: the harness runs `golden_sql` live and never trusts the literal `golden` numbers.
# Tool names are the STUB names (count_by, search_logs, trend); map them to the final tool set (#r2).
# Fields: role, question, must_call, must_not_call, order, args, golden_sql (scalar or first cell),
#         checks (extra named checks), judge (rubric ids), tags.

- id: eng-01
  role: Engineer
  question: "Show me the BGL data TLB error interrupts on 2005-06-11. Which node produced them and what happened just before the first one?"
  must_call: [search_logs]
  args: {search_logs: {dataset: bgl, text: "re:TLB"}}
  golden_sql: "SELECT count(*) FROM bgl WHERE alert_label='KERNDTLB' AND ts >= '2005-06-11' AND ts < '2005-06-12'"
  golden: 152182
  checks: [{mentions: "R30-M0-N9-C:J16-U01"}]
  tags: [search, bgl, nearby]
- id: eng-02
  role: Engineer
  question: "What does a 'data storage interrupt' look like in BGL, when did the first one occur and on which node?"
  must_call: [search_logs]
  checks: [{mentions: "R10-M0-N5-C:J09-U11"}, {mentions: "2005-06-13"}]
  tags: [search, bgl]
- id: eng-03
  role: Engineer
  question: "OpenStack returned HTTP 503 twice. Show those requests and what the identity service logged at the same moment."
  must_call: [search_logs]
  checks: [{mentions: "Unable to validate token|keystone"}]
  tags: [search, openstack, nearby, cross-component]
- id: eng-04
  role: Engineer
  question: "Which OpenStack request was the slowest, and what was it doing?"
  checks: [{mentions: "4\\.16"}, {mentions: "servers/detail"}]
  tags: [openstack, latency]
- id: eng-05
  role: Engineer
  question: "Find OpenStack ERROR Log Entries from the periodic task and tell me which Component raised them."
  must_call: [search_logs]
  checks: [{mentions: "periodic_task|image_cache|imagecache"}]
  tags: [search, openstack]
- id: eng-06
  role: Engineer
  question: "What happened to instance 544fd51c-4edc-4780-baae-ba1d80a0acfc?"
  must_call: [search_logs]
  args: {search_logs: {dataset: openstack, text: "re:544fd51c"}}
  golden_sql: "SELECT count(*) FROM openstack WHERE instance_id='544fd51c-4edc-4780-baae-ba1d80a0acfc'"
  golden: 25
  tags: [search, openstack, labelled-anomaly]
- id: eng-07
  role: Engineer
  question: "Show the BGL 'Kill' level Log Entries and the component that emitted them."
  must_call: [search_logs]
  tags: [search, bgl]
- id: eng-08
  role: Engineer
  question: "Are there 'Unknown base file' warnings in OpenStack? How many, and is it one file or many?"
  golden_sql: "SELECT count(*) FROM openstack WHERE content ILIKE '%Unknown base file%'"
  tags: [search, aggregation, openstack]
- id: eng-09
  role: Engineer
  question: "Give me the first 5 KERNSTOR alert lines on 2005-06-13 with node and timestamp."
  must_call: [search_logs]
  tags: [search, bgl, time-filter]
- id: eng-10
  role: Engineer
  question: "In BGL, what failed right after the first FATAL APP entry? What should I check next?"
  must_call: [search_logs]
  tags: [search, bgl, nearby, next-step]

- id: tl-01
  role: Team Lead
  question: "Which BGL alert categories recur most over the whole period, with counts?"
  must_call: [count_by]
  args: {count_by: {dataset: bgl, group_by: alert_label}}
  golden_sql: "SELECT count(*) FROM bgl WHERE alert_label='KERNDTLB'"
  golden: 152734
  tags: [aggregation, bgl]
- id: tl-02
  role: Team Lead
  question: "How did BGL alert volume change month by month? Is it a steady problem or spikes?"
  must_call: [trend]
  args: {trend: {dataset: bgl, bucket: month}}
  golden_sql: "SELECT count(*) FROM bgl WHERE alert_label<>'-' AND ts >= '2005-06-01' AND ts < '2005-07-01'"
  golden: 225153
  tags: [trend, bgl]
- id: tl-03
  role: Team Lead
  question: "Which BGL Components emit the most FATAL Log Entries?"
  must_call: [count_by]
  args: {count_by: {dataset: bgl, group_by: component, level: FATAL}}
  golden_sql: "SELECT count(*) FROM bgl WHERE level='FATAL' AND component='KERNEL'"
  golden: 626450
  tags: [aggregation, bgl]
- id: tl-04
  role: Team Lead
  question: "Which OpenStack Components produce warnings and errors, and how many each?"
  must_call: [count_by]
  golden_sql: "SELECT count(*) FROM openstack WHERE level='WARNING' AND component='nova.virt.libvirt.imagecache'"
  golden: 3059
  tags: [aggregation, openstack]
- id: tl-05
  role: Team Lead
  question: "Is the KERNDTLB problem spread across the machine or concentrated? Over which days?"
  must_call: [trend]
  checks: [{mentions: "2005-06-11"}]
  golden_sql: "SELECT count(DISTINCT node) FROM bgl WHERE alert_label='KERNDTLB'"
  golden: 541
  tags: [trend, concentration, bgl]
- id: tl-06
  role: Team Lead
  question: "Which BGL racks have the most alert Log Entries?"
  must_call: [count_by]
  args: {count_by: {group_by: rack}}
  golden_sql: "SELECT count(*) FROM bgl WHERE alert_label<>'-' AND rack='R30'"
  golden: 154206
  tags: [aggregation, bgl]
- id: tl-07
  role: Team Lead
  question: "Give me Log Entry counts for both Datasets of the Base Corpus, by level."
  must_call: [count_by]
  golden_sql: "SELECT (SELECT count(*) FROM bgl) + (SELECT count(*) FROM openstack)"
  golden: 4955783
  tags: [aggregation, whole-corpus, both-datasets]
- id: tl-08
  role: Team Lead
  question: "Which day had the most APPSEV alerts and is it a recurring pattern?"
  must_call: [trend]
  checks: [{mentions: "2005-11-26"}]
  tags: [trend, bgl]
- id: tl-09
  role: Team Lead
  question: "How many OpenStack API requests returned 404, and by which HTTP method?"
  golden_sql: "SELECT count(*) FROM openstack WHERE http_status=404"
  golden: 3969
  tags: [aggregation, openstack]
- id: tl-10
  role: Team Lead
  question: "Which Team should investigate first, based on alert counts per Component?"
  must_call: [count_by]
  checks: [{mentions: "Ownership Table|Team"}]
  tags: [aggregation, ownership]

