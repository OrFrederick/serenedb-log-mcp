# Curated synonym map for search_patterns (T14, #7 Decision proposal).
#
# Each key is an everyday word an asker may use; its list holds words that the Pattern template
# texts of the Base Corpus actually use for the same thing. search_patterns adds the list to the
# query at half weight (BM25 over the stemmed template texts), so "memory" also finds the DDR,
# EDRAM and L3 Patterns of BGL and "storage" the Lustre and NFS mount Patterns. The expansion is
# one-way and one level deep: a synonym is never expanded again.
#
# Rules for editing:
# - keys and values are single lower-case words (letters, digits, underscores);
# - every value must occur in at least one Pattern template text of the Base Corpus, after
#   stemming (tests/corpus/test_catalogue_corpus.py checks this against the derived catalogue);
# - keep it small and reviewable: the catalogue itself (list_patterns) is the primary path, and
#   this map only helps the lexical fallback over paraphrases.
#
# Provenance and caveat: merged from the two #7 research maps
# (research/7-OrFrederick:research/7/OrFrederick/synonyms.yaml and
# research/7-NoNaim95:research/7/NoNaim95/experiments/r7e_synonyms.py). Both were written by the
# Claude that labelled the #7 evaluation queries, after reading the template list, so any recall
# measured with this map on those queries is optimistic. Fresh, human-labelled queries are needed
# before retrieval numbers are quoted (#7, decision 3 for the humans).

# Memory and caches
memory: [ddr, edram, l3, ecc, rank, symbol, sram, cache, parity]
ram: [ddr, edram, memory, ecc]
corruption: [parity, ecc, uncorrectable, invalid]
fixed: [corrected, correctable, steering]

# Interconnect and network
